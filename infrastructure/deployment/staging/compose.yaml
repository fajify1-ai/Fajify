name: fajify-private-staging
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets:
    - db_owner_password
    - db_migrator_password
    - db_runtime_password
    volumes:
    - staging-db:/var/lib/postgresql/data
    - ./init-db.sh:/docker-entrypoint-initdb.d/10-faji.sh:ro
    - ./restrict-databases.sh:/docker-entrypoint-initdb.d/99-restrict-databases.sh:ro
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command:
    - sh
    - -c
    - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
    - redis_password
    volumes:
    - staging-redis:/data
    networks:
    - data
  mailpit:
    image: axllent/mailpit:v1.27
    networks:
    - app
    ports:
    - 127.0.0.1:8025:8025
  migrate:
    build:
      context: ../../..
      dockerfile: infrastructure/deployment/staging/api.Dockerfile
      target: migrations
    environment:
      FAJI_DB_USER: faji_migrator
      FAJI_DB_NAME: fajify_staging_local
      FAJI_DB_PASSWORD_SECRET: db_migrator_password
      FAJI_STAGING_PREPARATION_ACK: private-staging-only
    secrets:
    - db_migrator_password
    - db_runtime_password
    networks:
    - data
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  api:
    build:
      context: ../../..
      dockerfile: infrastructure/deployment/staging/api.Dockerfile
      target: runtime
    environment:
      NODE_ENV: staging
      FAJI_DB_USER: faji_runtime
      FAJI_DB_NAME: fajify_staging_local
      FAJI_DB_PASSWORD_SECRET: db_runtime_password
      BETTER_AUTH_URL: https://api.fajify.com
      FAJI_WEB_ORIGINS: https://preview.fajify.com,https://admin-dev.fajify.com,https://fajify.com
      FAJI_TRUSTED_PROXY_CIDRS: 172.30.88.0/24
      FAJI_REGISTRATION_ENABLED: 'true'
      S3_ENDPOINT: ${S3_ENDPOINT:?configure private staging object store}
      S3_BUCKET: ${S3_BUCKET:?configure private staging bucket}
      AUTH_EMAIL_FROM: Faji Staging <auth@faji.test>
      FAJI_SMS_WEBHOOK_URL: ${FAJI_SMS_WEBHOOK_URL:?configure approved sandbox SMS
        webhook}
    secrets:
    - db_runtime_password
    - better_auth_secret
    - smtp_url
    - sms_webhook_secret
    - redis_password
    networks:
    - app
    - data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    read_only: true
    tmpfs:
    - /tmp
  customer:
    build:
      context: ../../..
      dockerfile: infrastructure/deployment/staging/web.Dockerfile
      args:
        WEB_APP: customer_web
    environment:
      FAJI_API_URL: http://api:3001
      FAJI_WEB_ORIGIN: https://preview.fajify.com
      FAJI_WEB_ORIGINS: https://preview.fajify.com,https://fajify.com
      FAJI_ALLOW_INTERNAL_HTTP: 'true'
      FAJI_TRUSTED_INGRESS: 'true'
    networks:
    - app
    depends_on:
    - api
    read_only: true
    tmpfs:
    - /tmp
    - /app/apps/customer_web/.next/cache
  admin:
    build:
      context: ../../..
      dockerfile: infrastructure/deployment/staging/web.Dockerfile
      args:
        WEB_APP: admin_web
    environment:
      FAJI_API_URL: http://api:3001
      FAJI_WEB_ORIGIN: https://admin.faji.test:8443
      FAJI_ALLOW_INTERNAL_HTTP: 'true'
      FAJI_TRUSTED_INGRESS: 'true'
    networks:
    - app
    depends_on:
    - api
    read_only: true
    tmpfs:
    - /tmp
    - /app/apps/admin_web/.next/cache
  business:
    build:
      context: ../../..
      dockerfile: infrastructure/deployment/staging/web.Dockerfile
      args:
        WEB_APP: business_web
    environment:
      FAJI_API_URL: http://api:3001
      FAJI_WEB_ORIGIN: https://preview.fajify.com
      FAJI_WEB_ORIGINS: https://preview.fajify.com,https://fajify.com
      FAJI_ALLOW_INTERNAL_HTTP: 'true'
      FAJI_TRUSTED_INGRESS: 'true'
    networks:
    - app
    depends_on:
    - api
    read_only: true
    tmpfs:
    - /tmp
    - /app/apps/business_web/.next/cache
  dispatch:
    build:
      context: ../../..
      dockerfile: infrastructure/deployment/staging/web.Dockerfile
      args:
        WEB_APP: ride_dispatch_web
    environment:
      FAJI_API_URL: http://api:3001
      FAJI_WEB_ORIGIN: https://dispatch.faji.test:8443
      FAJI_ALLOW_INTERNAL_HTTP: 'true'
      FAJI_TRUSTED_INGRESS: 'true'
    networks:
    - app
    depends_on:
    - api
    read_only: true
    tmpfs:
    - /tmp
    - /app/apps/ride_dispatch_web/.next/cache
  ingress:
    image: nginx:1.28-alpine
    ports:
    - 127.0.0.1:8443:443
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./.secrets/tls.crt:/etc/nginx/tls/tls.crt:ro
    - ./.secrets/tls.key:/etc/nginx/tls/tls.key:ro
    networks:
    - app
    depends_on:
    - api
    - customer
    - admin
    - business
    - dispatch
volumes:
  staging-db: {}
  staging-redis: {}
networks:
  data:
    internal: true
  app:
    ipam:
      config:
      - subnet: 172.30.88.0/24
secrets:
  db_owner_password:
    file: ./.secrets/db_owner_password
  db_migrator_password:
    file: ./.secrets/db_migrator_password
  db_runtime_password:
    file: ./.secrets/db_runtime_password
  redis_password:
    file: ./.secrets/redis_password
  better_auth_secret:
    file: ./.secrets/better_auth_secret
  smtp_url:
    file: ./.secrets/smtp_url
  sms_webhook_secret:
    file: ./.secrets/sms_webhook_secret
