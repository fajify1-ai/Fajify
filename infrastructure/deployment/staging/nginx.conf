map $uri $faji_log_path {
 ~^/api/auth/reset-password/ /api/auth/reset-password/redacted;
 default $uri;
}
log_format faji_safe '$remote_addr $request_method $faji_log_path $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
map $http_host $faji_upstream {
 default "";
 api.faji.test:8443 api:3001;
 customer.faji.test:8443 customer:3000;
 admin.faji.test:8443 admin:3000;
 business.faji.test:8443 business:3000;
 dispatch.faji.test:8443 dispatch:3000;
}
server {
 listen 443 ssl;
 access_log /var/log/nginx/access.log faji_safe;
 server_name api.faji.test customer.faji.test admin.faji.test business.faji.test dispatch.faji.test;
 ssl_certificate /etc/nginx/tls/tls.crt;
 ssl_certificate_key /etc/nginx/tls/tls.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "frame-ancestors 'none'" always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Content-Type-Options nosniff always;
 client_max_body_size 1m;
 resolver 127.0.0.11 valid=10s;
 if ($faji_upstream = "") { return 444; }
 set_real_ip_from 172.30.88.1;
 real_ip_header X-Forwarded-For;
 real_ip_recursive on;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-Proto https;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header X-Faji-Client-Ip $remote_addr;
 proxy_read_timeout 30s;
 location /api/auth/ {
  client_max_body_size 16k;
  limit_req zone=auth burst=20 nodelay;
  limit_req_status 429;
  proxy_pass http://$faji_upstream;
 }
 location / {
  limit_req zone=api burst=40 nodelay;
  limit_req_status 429;
  proxy_pass http://$faji_upstream;
 }
}
