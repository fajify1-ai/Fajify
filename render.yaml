services:
  - type: web
    name: fajify-dev-db-bootstrap
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: off
    buildCommand: corepack pnpm install --frozen-lockfile --filter @faji/database...
    startCommand: >-
      corepack pnpm --filter @faji/database migrate &&
      NODE_PATH=./packages/database/node_modules node tooling/render-dev-keycloak-db.cjs &&
      node -e 'require("node:http").createServer((req,res) => {res.writeHead(204); res.end()}).listen(Number(process.env.PORT), "0.0.0.0")'
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FAJI_DATABASE_URL
        fromDatabase:
          name: fajify-dev-postgres
          property: connectionString
      - fromGroup: fajify-dev-keycloak-database
  - type: web
    name: fajify-dev-keycloak
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: off
    dockerfilePath: ./infrastructure/keycloak/Dockerfile.render
    healthCheckPath: /realms/faji/.well-known/openid-configuration
    envVars:
      - key: KC_DB_URL_HOST
        fromDatabase:
          name: fajify-dev-postgres
          property: host
      - key: KC_DB_URL_DATABASE
        value: fajify_dev_keycloak
      - key: KC_DB_USERNAME
        value: fajify_dev_keycloak
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: fajify-dev-admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - fromGroup: fajify-dev-keycloak-database
  - type: web
    name: fajify-dev-api
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health/ready
    buildCommand: corepack pnpm install --frozen-lockfile --filter @faji/api... && corepack pnpm --filter @faji/api build
    startCommand: corepack pnpm --filter @faji/api start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: staging
      - key: FAJI_DATABASE_URL
        fromDatabase:
          name: fajify-dev-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fajify-dev-redis
          property: connectionString
      - key: KEYCLOAK_ISSUER
        value: https://fajify-dev-keycloak.onrender.com/realms/faji
      - key: KEYCLOAK_AUDIENCE
        value: faji-api
      - key: S3_ENDPOINT
        value: https://storage-disabled.invalid
      - key: S3_BUCKET
        value: fajify-dev-disabled
envVarGroups:
  - name: fajify-dev-keycloak-database
    envVars:
      - key: KC_DB_PASSWORD
        generateValue: true
databases:
  - name: fajify-dev-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: fajify_dev_postgres
    user: fajify_dev_postgres_user
    ipAllowList: []
